<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon espace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d8a82'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Segoe UI,Arial'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--canvas:#e9eef2;--sidebar:#14202c;--soft:#f2f5f8;--text:#1c2733;--text2:rgba(28,39,51,.68);--text3:rgba(28,39,51,.46);--hover:rgba(20,60,90,.06);--active:rgba(13,138,130,.12);--bd:rgba(28,39,51,.10);--bd2:rgba(28,39,51,.18);--accent:#0d8a82;--accent-soft:rgba(13,138,130,.13);--danger:#d64545;--card:#fff;--done:#1f9d74;--doing:#2f7fc1;--hl:rgba(255,190,60,.35);
--p-gray-bg:#e6ebf0;--p-gray-fg:#3a4756;--p-blue-bg:#dcebf7;--p-blue-fg:#1b4b72;--p-green-bg:#d7f1e4;--p-green-fg:#145a3a;--p-yellow-bg:#fcefcd;--p-yellow-fg:#6b4a0a;--p-red-bg:#fde0dd;--p-red-fg:#8a1f17;
--font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--font-h:Bahnschrift,"Segoe UI Variable Display",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,monospace;
--sh-card:0 0 0 1px rgba(16,24,40,.07),0 1px 3px rgba(16,24,40,.08);--sh-pop:0 0 0 1px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.12),0 16px 40px rgba(16,24,40,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161d24;--canvas:#0e1419;--sidebar:#0a1015;--soft:#1b232b;--text:#e3e9ef;--text2:rgba(227,233,239,.66);--text3:rgba(227,233,239,.42);--hover:rgba(255,255,255,.06);--active:rgba(43,179,168,.16);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.17);--accent:#2bb3a8;--accent-soft:rgba(43,179,168,.16);--danger:#f06a6a;--card:#1d252e;--done:#34b58a;--doing:#4f9ad8;
--p-gray-bg:#2c3640;--p-gray-fg:#d5dde5;--p-blue-bg:#1e3a55;--p-blue-fg:#cfe3f5;--p-green-bg:#1d4434;--p-green-fg:#cdeedd;--p-yellow-bg:#4d3a12;--p-yellow-fg:#f6e2b3;--p-red-bg:#522522;--p-red-fg:#f7d0cc}}
:root[data-theme=dark]{--bg:#161d24;--canvas:#0e1419;--sidebar:#0a1015;--soft:#1b232b;--text:#e3e9ef;--text2:rgba(227,233,239,.66);--text3:rgba(227,233,239,.42);--hover:rgba(255,255,255,.06);--active:rgba(43,179,168,.16);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.17);--accent:#2bb3a8;--accent-soft:rgba(43,179,168,.16);--danger:#f06a6a;--card:#1d252e;--done:#34b58a;--doing:#4f9ad8;
--p-gray-bg:#2c3640;--p-gray-fg:#d5dde5;--p-blue-bg:#1e3a55;--p-blue-fg:#cfe3f5;--p-green-bg:#1d4434;--p-green-fg:#cdeedd;--p-yellow-bg:#4d3a12;--p-yellow-fg:#f6e2b3;--p-red-bg:#522522;--p-red-fg:#f7d0cc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--font);color:var(--text);background:var(--canvas);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:8px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
#app{display:flex;height:100%;background:var(--canvas)}
/* sidebar */
#sidebar{--text:#e6edf3;--text2:rgba(230,237,243,.72);--text3:rgba(230,237,243,.45);--hover:rgba(255,255,255,.07);--active:rgba(60,199,187,.16);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.18);--accent:#3cc7bb;position:relative;flex:none;width:248px;background:var(--sidebar);color:var(--text);display:flex;flex-direction:column;z-index:30}
#sidebar.hidden{display:none}
#sbResize{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5}
#sbResize:hover{background:var(--accent);opacity:.4}
.sb-head{display:flex;align-items:center;gap:10px;padding:12px 12px 8px;height:52px}
.sb-head .nm{flex:1;font:600 15px var(--font-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:28px;height:28px;border-radius:8px;flex:none;display:block}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px}
.row{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:8px;cursor:pointer;position:relative;color:var(--text2);white-space:nowrap}
.row:hover{background:var(--hover);color:var(--text)}
.row.active{background:var(--active);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.row .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.row .em{width:18px;text-align:center;flex:none}
.row .kb{font-size:11px;color:var(--text3)}
.row .act{display:none;gap:2px;align-items:center}
.row:hover .act{display:flex}.row:hover .hov-hide{display:none}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--accent);border-radius:2px}
.row.drop-before::before{top:-1px}.row.drop-after::after{bottom:-1px}
.row.drop-into{background:var(--active);outline:1px dashed var(--accent)}
.ib{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.ib:hover{background:var(--hover);color:var(--text)}
.sec{display:flex;align-items:center;height:38px;padding:0 8px;margin-top:6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);font-weight:600}
.sec .lb{flex:1;cursor:default}.sec.link .lb{cursor:pointer}.sec.link .lb:hover{color:var(--text)}
.sec .act{display:none;gap:2px}.sec:hover .act{display:flex}
.sb-foot{padding:8px 12px 12px;border-top:1px solid var(--bd)}
.sb-foot .btn-new{display:flex;gap:8px;align-items:center;height:32px;width:100%;padding:0 8px;border-radius:8px;color:var(--text);font-weight:500}
.sb-foot .btn-new:hover{background:var(--hover)}
.sb-foot .note{font-size:11px;color:var(--text3);padding:4px 8px 0}
.indent{padding-left:22px}
/* main */
#main{flex:1;min-width:0;margin:8px;border-radius:14px;background:var(--bg);box-shadow:0 0 0 1px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);display:flex;overflow:hidden;position:relative}
#sheet{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:48px;flex:none;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 14px}
#topbar .crumbs{flex:1;display:flex;align-items:center;gap:6px;min-width:0;color:var(--text2);overflow:hidden;white-space:nowrap}
#topbar .crumbs a{cursor:pointer;color:var(--text2)}#topbar .crumbs a:hover{color:var(--text)}
#topbar .crumbs b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
#saveState{font-size:12px;color:var(--text3);white-space:nowrap}
#scroller{flex:1;overflow:auto;position:relative}
.page{max-width:900px;margin:0 auto;padding:48px 72px 160px}
.page.wide{max-width:1200px}
#taskPanel{position:absolute;top:0;right:0;bottom:0;width:min(600px,52vw);background:var(--bg);box-shadow:-1px 0 0 var(--bd),-12px 0 32px rgba(16,24,40,.12);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;z-index:20}
#taskPanel.open{transform:none}
.tp-bar{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--bd);color:var(--text2)}
.tp-body{flex:1;overflow:auto;padding:24px 32px 120px}
@media (max-width:700px){#sidebar{position:fixed;top:0;bottom:0;left:0;box-shadow:var(--sh-pop)}#main{margin:0;border-radius:0}.page{padding:28px 20px 140px}}
/* page header */
.pg-icon{width:62px;height:62px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;margin-bottom:14px}
.pg-title{font:600 36px/1.2 var(--font-h);outline:none;margin:0 0 12px;min-height:44px;word-break:break-word}
.pg-title:empty::before{content:attr(data-ph);color:var(--text3)}
.props{margin:8px 0 20px}
.prop{display:flex;align-items:center;min-height:32px;gap:0}
.prop .pl{width:160px;display:flex;gap:8px;align-items:center;color:var(--text2);flex:none}
.prop .pv{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.pg-desc{color:var(--text2);outline:none;margin:-4px 0 14px;min-height:22px}
.pg-desc:empty::before{content:attr(data-ph);color:var(--text3)}
/* components */
.pill{display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;cursor:default;background:var(--p-gray-bg);color:var(--p-gray-fg)}
.pill.blue{background:var(--p-blue-bg);color:var(--p-blue-fg)}.pill.green{background:var(--p-green-bg);color:var(--p-green-fg)}.pill.yellow{background:var(--p-yellow-bg);color:var(--p-yellow-fg)}.pill.red{background:var(--p-red-bg);color:var(--p-red-fg)}
button.pill{cursor:pointer}button.pill:hover{filter:brightness(.96)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--bd2);background:var(--card);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{color:var(--accent);cursor:pointer}.linkbtn:hover{text-decoration:underline}
.progress{height:6px;border-radius:99px;background:var(--bd);display:flex;overflow:hidden;min-width:60px}
.progress i{display:block;height:100%}.progress .pd{background:linear-gradient(90deg,var(--done),var(--accent))}.progress .pg{background:var(--doing)}
.tabs{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin:0 0 18px}
.tabs button{height:30px;padding:0 12px;border-radius:9px;color:var(--text2);display:flex;gap:6px;align-items:center;font-weight:500}
.tabs button.on{background:var(--card);color:var(--accent);box-shadow:var(--sh-card)}
.tabs .ct{font-size:11px;opacity:.7}
.tabrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.tabrow .sp{flex:1}
.check{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--bd2);flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.check:hover{border-color:var(--done)}.check.on{background:var(--done);border-color:var(--done)}.check svg{width:11px;height:11px;stroke-width:3}
.check:not(.on) svg{display:none}
.lbl-sec{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);font-weight:600;margin:28px 0 10px}
.lbl-sec .cnt{background:var(--danger);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;letter-spacing:0}
.hello{font:600 34px/1.2 var(--font-h);margin:0 0 6px}.hello-u{width:44px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--doing));margin:10px 0 6px}
.hello-d{color:var(--text2);margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;border-radius:12px;background:var(--card);box-shadow:var(--sh-card);padding:16px 14px 14px;border-top:3px solid var(--accent);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-pop)}
.tile .em{font-size:24px}.tile .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile .sub{font-size:12px;color:var(--text2)}
.tile.new{border:1.5px dashed var(--bd2);border-top:1.5px dashed var(--bd2);box-shadow:none;align-items:center;justify-content:center;color:var(--text2);min-height:110px}
.trow{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--bd)}
.trow:hover{background:var(--hover)}.trow .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trow .tt.dn{text-decoration:line-through;color:var(--text3)}
.trow .pj{color:var(--text3);font-size:12px}
.due{font-size:12px;color:var(--text2);white-space:nowrap}.due.late{color:var(--danger)}.due.today{color:var(--accent);font-weight:600}
.empty-note{color:var(--text3);padding:10px 8px}
/* kanban */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:20px}
.col{width:272px;flex:none;background:var(--soft);border-radius:12px;border-top:3px solid var(--p-gray-fg);padding:10px 8px 10px;min-height:120px}
.col.doing{border-top-color:var(--doing)}.col.done{border-top-color:var(--done)}
.col.over{outline:2px dashed var(--accent)}
.col-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px}.col-h .sp{flex:1}.col-h .n{color:var(--text3);font-size:12px}
.card{background:var(--card);border-radius:10px;box-shadow:var(--sh-card);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-1px);box-shadow:var(--sh-pop)}
.card .ct{font-weight:500;word-break:break-word}.card .ct.dn{text-decoration:line-through;color:var(--text3)}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--text2)}
.card.dragging{opacity:.4}.card.drop-before::before,.card.drop-after::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);border-radius:3px}.card.drop-before::before{top:-6px}.card.drop-after::after{bottom:-6px}
.inl-add{width:100%;border:1px solid var(--accent);border-radius:8px;padding:7px 10px;background:var(--card);outline:none}
.addrow{display:flex;gap:6px;align-items:center;color:var(--text2);height:32px;padding:0 6px;border-radius:8px;cursor:pointer}.addrow:hover{background:var(--hover)}
/* list table */
.ltab .lh,.ltab .lr{display:grid;grid-template-columns:1fr 120px 110px 140px;gap:8px;align-items:center;padding:0 8px}
.ltab .lh{height:30px;color:var(--text3);font-size:12px;border-bottom:1px solid var(--bd)}
.ltab .lr{min-height:38px;border-bottom:1px solid var(--bd);cursor:pointer}.ltab .lr:hover{background:var(--hover)}
.ltab .nm{display:flex;gap:10px;align-items:center;min-width:0}.ltab .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input.date{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;font-size:12px;color:var(--text2)}input.date:hover,input.date:focus{border-color:var(--bd2);background:var(--card)}
/* docs / files / meetings lists */
.drow{display:flex;align-items:center;gap:12px;height:44px;padding:0 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--bd)}.drow:hover{background:var(--hover)}
.drow .em{font-size:20px;width:26px;text-align:center}.drow .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drow .sub{color:var(--text3);font-size:12px}
.drow .act{display:none;gap:2px}.drow:hover .act{display:flex}
.dropzone{border:1.5px dashed var(--bd2);border-radius:12px;padding:22px;text-align:center;color:var(--text2);margin-bottom:14px}.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone small{display:block;color:var(--text3);margin-top:6px}
.mcard{padding:12px 14px;border-radius:12px;box-shadow:var(--sh-card);background:var(--card);margin-bottom:10px;cursor:pointer}.mcard:hover{box-shadow:var(--sh-pop)}
.mcard .ex{font-size:12.5px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.mon{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);font-weight:600;margin:22px 0 6px}
/* popovers, modals, toasts */
.menu{position:fixed;z-index:200;min-width:180px;max-width:320px;background:var(--card);border-radius:12px;box-shadow:var(--sh-pop);padding:6px;max-height:60vh;overflow:auto}
.menu .mi{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.menu .mi:hover,.menu .mi.sel{background:var(--hover)}.menu .mi.danger{color:var(--danger)}.menu .mi.on{color:var(--accent);font-weight:600}
.menu .sep{height:1px;background:var(--bd);margin:5px 4px}.menu .mh{font-size:11px;color:var(--text3);padding:4px 10px}
.menu .mi .sub{margin-left:auto;color:var(--text3);font-size:12px}
.modal-bg{position:fixed;inset:0;z-index:300;background:rgba(10,20,30,.38);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.modal{width:min(480px,92vw);background:var(--card);border-radius:16px;box-shadow:var(--sh-pop);padding:22px;max-height:80vh;overflow:auto}
.modal h3{margin:0 0 8px;font:600 18px var(--font-h)}.modal p{margin:0 0 14px;color:var(--text2)}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal label.f{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
.modal input[type=text],.modal input[type=date],.modal select{width:100%;height:34px;border-radius:8px;border:1px solid var(--bd2);background:var(--bg);padding:0 10px;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal.search{width:min(620px,94vw);padding:0}.modal.search input{border:0;border-bottom:1px solid var(--bd);border-radius:16px 16px 0 0;height:50px;font-size:16px;padding:0 18px}
.sr{max-height:56vh;overflow:auto;padding:6px}.sr .gh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);padding:10px 10px 4px;font-weight:600}
.sr .it{display:flex;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;align-items:flex-start}.sr .it.sel{background:var(--active)}.sr .it .em{width:22px;text-align:center}.sr .it .x{font-size:12px;color:var(--text3)}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#14202c;color:#e6edf3;border-radius:10px;padding:9px 14px;box-shadow:var(--sh-pop);display:flex;gap:14px;align-items:center}
.toast button{color:#3cc7bb;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:4px}.emoji-grid button{height:34px;font-size:20px;border-radius:8px}.emoji-grid button:hover{background:var(--hover)}
.welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--canvas);z-index:500;padding:20px}
.wcard{width:min(520px,100%);background:var(--card);border-radius:16px;box-shadow:var(--sh-pop);padding:28px}
.wcard h2{font:600 22px var(--font-h);margin:12px 0 6px}.wcard p{color:var(--text2);margin:0 0 16px}
.wopt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--bd2);margin-bottom:10px}
.wopt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}.wopt:disabled{opacity:.55;cursor:default}
.wopt b{display:block}.wopt span{color:var(--text2);font-size:12.5px}
.callout-info{display:flex;gap:10px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin:10px 0}
.callout-info .ic{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
kbd{font:12px var(--mono);background:var(--soft);border:1px solid var(--bd2);border-bottom-width:2px;border-radius:5px;padding:0 5px}

const pad2=n=>String(n).padStart(2,'0');

function normalize(d){

    if(!s.rangeCount||s.isCollapsed||!ed.contains(s.anchorNode)||!ed.contains(s.focusNode)||!s.toString().trim()){hideTfs();return}
    const rg=s.getRangeAt(0),rcs=rg.getClientRects();if(!rcs.length){hideTfs();return}
    const last=rcs[rcs.length-1];
    if(!tfsBtn){tfsBtn=h('div',{class:'floatbar',onmousedown:e=>e.preventDefault()},h('button',{class:'pri',onclick:()=>startTaskFromSel()},'Créer une tâche'));document.body.append(tfsBtn)}
    tfsBtn.style.left=Math.max(6,Math.min(last.right-60,innerWidth-170))+'px';tfsBtn.style.top=Math.min(innerHeight-44,last.bottom+6)+'px';
  };
  const onSel=()=>{if(!document.contains(ed)){document.removeEventListener('selectionchange',onSel);hideTfs();return}upd()};
  document.addEventListener('selectionchange',onSel);
  async function startTaskFromSel(){
    const s=getSelection();if(!s.rangeCount)return;const rg=s.getRangeAt(0).cloneRange();
    const text=s.toString().replace(/\s+/g,' ').trim().slice(0,200);hideTfs();
    const multi=lineOf(ed,rg.startContainer)!==lineOf(ed,rg.endContainer);
    const sc=document.querySelector('#scroller'),top=sc?sc.scrollTop:0;
    // projet par défaut
    let def='';const ls=linksOfMeeting(m);const lp=ls.find(l=>l.type==='project'&&proj(l.id));if(lp)def=lp.id;else{const lt=ls.find(l=>l.type==='task'&&task(l.id));if(lt)def=task(lt.id).projectId}
    if(!def||!proj(def))def=proj(S.settings.lastTaskProject)?S.settings.lastTaskProject:(S.projects.slice().sort(byOrder)[0]||{}).id||'';
    const name=h('input',{type:'text',value:text}),sel=h('select'),stSel=h('select'),prSel=h('select'),due=h('input',{type:'date'}),chk=h('input',{type:'checkbox',checked:true});
    const fillProj=v=>{sel.replaceChildren(...S.projects.slice().sort(byOrder).map(p=>h('option',{value:p.id},p.icon+' '+(p.title||'Sans titre'))),h('option',{value:'__new'},'+ Nouveau projet…'));sel.value=v||(S.projects[0]?S.projects[0].id:'__new')};
    fillProj(def);let prev=sel.value;
    sel.addEventListener('change',async()=>{if(sel.value==='__new'){const n=await modalName('Nouveau projet','');if(n!=null){const p={id:uid(),icon:'📁',title:n||'Nouveau projet',description:'',due:'',order:nextOrder(S.projects)};S.projects.push(p);save();fillProj(p.id);prev=p.id}else sel.value=prev}else prev=sel.value});
    Object.keys(STATUS).forEach(k=>stSel.append(h('option',{value:k},STATUS[k][0])));
    prSel.append(h('option',{value:''},'Vide'));Object.keys(PRIO).forEach(k=>prSel.append(h('option',{value:k},PRIO[k][0])));
    const lbl=multi?'Ajouter un lien vers la tâche après le texte sélectionné':'Remplacer le texte sélectionné par un lien vers la tâche';
    const body=h('div',null,h('label',{class:'f'},'Nom'),name,h('label',{class:'f'},'Projet'),sel,h('label',{class:'f'},'Statut'),stSel,h('label',{class:'f'},'Priorité'),prSel,h('label',{class:'f'},'Échéance'),due,h('label',{style:'display:flex;gap:8px;align-items:center;margin-top:14px;cursor:pointer'},chk,lbl));
    const create=()=>{
      const pid=sel.value==='__new'?'':sel.value;
      const t=newTask(pid,stSel.value,name.value.trim()||text,{priority:prSel.value,due:due.value,meetingId:m.id});
      if(chk.checked){
        const mn=h('span',{class:'mention',contenteditable:'false','data-type':'task','data-id':t.id});mn.textContent=mentionLabel('task',t.id);
        ed.focus({preventScroll:true});
        if(multi){const r2=rg.cloneRange();r2.collapse(false);r2.insertNode(mn);mn.before(document.createTextNode(' '))}
        else{rg.deleteContents();rg.insertNode(mn)}
        const sp=document.createTextNode(' ');mn.after(sp);
        const r3=document.createRange();r3.setStart(sp,1);r3.collapse(true);const s2=getSelection();s2.removeAllRanges();s2.addRange(r3);
        E.commit();E.changed(true);
      }
      updateLinks();
      toast('Tâche créée','Ouvrir',()=>openTask(t.id));
      return t;
    };
    const r=await modal({title:'Créer une tâche',body,buttons:[{label:'Annuler',value:false},{label:'Créer la tâche',pri:true,value:'ok',action:()=>{create()}}],onOpen:(mm)=>{name.addEventListener('keydown',e=>{if(e.key==='Enter'){create();mm.close('ok')}})}});
    if(r!=='ok'){ed.focus({preventScroll:true});try{const s3=getSelection();s3.removeAllRanges();s3.addRange(rg)}catch(e){}}
    if(sc)sc.scrollTop=top;
  }
}
/* ================= Recherche, paramètres, instructions, démarrage ================= */
function openSearch(){
  closeMenu();
  const inp=h('input',{type:'text',placeholder:'Rechercher un projet, un document, une réunion, une tâche…'});
  const res=h('div',{class:'sr'});let items=[],sel=0,mod;
  const snippet=(txt,words)=>{const n=normTxt(txt);let i=-1;for(const w of words){i=n.indexOf(w);if(i>=0)break}if(i<0)return txt.slice(0,110);const a=Math.max(0,i-40);return (a?'…':'')+txt.slice(a,a+110)+(txt.length>a+110?'…':'')};
  function run(){
    const q=normTxt(inp.value).trim(),words=q.split(/\s+/).filter(Boolean);items=[];
    const match=(title,text)=>{const n=normTxt(title+' '+text);return words.every(w=>n.includes(w))};
    const groups=[['Projets','project',S.projects.slice().sort(byOrder).map(p=>({icon:p.icon,title:p.title||'Sans titre',text:p.description||'',go:()=>go({name:'project',id:p.id,tab:'board'})}))],
      ['Documents','doc',S.docs.map(d=>({icon:d.icon,title:d.title||'Sans titre',text:htmlText(d.content),go:()=>go({name:'doc',id:d.id})}))],
      ['Réunions','meeting',S.meetings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(m=>({icon:m.icon,title:m.title||'Réunion sans titre',text:htmlText(m.content),go:()=>go({name:'meeting',id:m.id})}))]];
    if(q)groups.push(['Tâches','task',S.tasks.map(t=>({icon:t.status==='done'?'☑':'☐',title:t.title||'Sans titre',text:htmlText(t.notes),go:()=>openTask(t.id)}))]);
    res.replaceChildren();
    groups.forEach(g=>{
      const hits=g[2].filter(x=>!q||match(x.title,x.text)).slice(0,8);if(!hits.length)return;
      res.append(h('div',{class:'gh'},g[0]));
      hits.forEach(x=>{const i=items.length;items.push(x);const ex=q&&x.text?snippet(x.text,words):'';
        res.append(h('div',{class:'it'+(i===sel?' sel':''),'data-i':i,onclick:()=>choose(i),onmousemove:()=>{if(sel!==i){sel=i;mark()}}},h('span',{class:'em'},x.icon),h('div',{style:'min-width:0'},h('div',null,x.title),ex?h('div',{class:'x'},ex):null)))});
    });
    if(!items.length)res.append(h('div',{class:'empty-note'},'Aucun résultat'));
    if(sel>=items.length)sel=Math.max(0,items.length-1);
  }
  function mark(){$$('.it',res).forEach(e=>e.classList.toggle('sel',+e.dataset.i===sel));const e=$('.it.sel',res);if(e)e.scrollIntoView({block:'nearest'})}
  function choose(i){const x=items[i];if(!x)return;mod.close();x.go()}
  inp.addEventListener('input',()=>{sel=0;run()});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);mark()}else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);mark()}else if(e.key==='Enter'){e.preventDefault();choose(sel)}});
  run();
  modal({cls:'search',body:h('div',null,inp,res),onOpen:m=>{mod=m}});
}
async function openSettings(){
  closeMenu();
  const seg=h('div',{class:'seg'});
  const setT=t=>{S.settings.theme=t;applyTheme();save();$$('button',seg).forEach(b=>b.classList.toggle('on',b.dataset.t===t))};
  [['light','Clair'],['dark','Sombre'],['system','Système']].forEach(([k,l])=>seg.append(h('button',{'data-t':k,class:S.settings.theme===k?'on':'',onclick:()=>setT(k)},l)));
  const row=(d,sub,ctl)=>h('div',{class:'set-row'},h('div',{class:'d'},d,sub?h('small',null,sub):null),ctl);
  const fi=h('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:()=>{const f=fi.files[0];if(f){modals.forEach(m=>m.close());importBackup(f)}}});
  const body=h('div',null,row('Thème',null,seg),
    row('Exporter une sauvegarde','Fichier JSON avec images et fichiers joints',h('button',{class:'btn',onclick:exportBackup},I('download'),'Exporter')),
    row('Importer une sauvegarde','Remplace toutes les données actuelles',h('button',{class:'btn',onclick:()=>fi.click()},I('archive'),'Importer')),fi);
  if(B&&B.local){

    body.append(row('Emplacement des données',B.label,h('button',{class:'btn',onclick:()=>{modals.forEach(m=>m.close());changeLocation()}},'Changer d’emplacement…')),
      row('Dernier enregistrement auto',null,last),
      row('Points de retour','Versions automatiques et manuelles',h('button',{class:'btn',onclick:()=>{modals.forEach(m=>m.close());showPoints()}},'Points de retour…')));
    if(B.kind==='fs')body.append(row('Accès au dossier','Autorisation d’écriture dans le dossier',h('button',{class:'btn',onclick:async()=>{const ok=await B.perm(true);toast(ok?'Accès autorisé':'Accès refusé');if(ok){SV.dirty=true;flush()}}},'Autoriser l’accès au dossier')));
  }
  modal({title:'Paramètres',body,buttons:[{label:'Fermer',pri:true}],noFocus:true});
}

/* ---------- touches globales ---------- */
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();if(!modals.length)openSearch();return}
  if(mod&&(e.key==='\\'||e.code==='Backslash')){e.preventDefault();toggleSidebar();return}
  if(e.key==='Escape'){
    if(curMenu){e.preventDefault();closeMenu();return}
    if(modals.length){e.preventDefault();modals[modals.length-1].close(undefined);return}
    if(TP.id){e.preventDefault();closeTask();return}
  }
});
